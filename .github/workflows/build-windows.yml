name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build FluffyChat for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Fix MSVC coroutine deprecation
        run: |
          echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_ALLOW_KEYWORD_MACROS" >> $env:GITHUB_ENV

      # ============================================================
      # 源码补丁
      # ============================================================

      - name: Apply patches
        shell: pwsh
        run: |

          # === Patch 1: chat.dart ===
          $chat = "lib/pages/chat/chat.dart"
          $c = Get-Content $chat -Raw

          # 1a. _updateScrollController: pixels>0 → maxScrollExtent-50
          #     影响所有滚动行为，不止未读标记
          $c = $c -replace `
            '(if \(!scrollController\.hasClients\) return;\r?\n)(\s+if \(timeline\?\.allowNewEvent == false \|\|)', `
            "`${1}    final scrolledUp = scrollController.position.pixels <`r`n        scrollController.position.maxScrollExtent - 50.0;`r`n`${2}"
          $c = $c -replace `
            'scrollController\.position\.pixels > 0 && _scrolledUp == false', `
            'scrolledUp && _scrolledUp == false'
          $c = $c -replace `
            'scrollController\.position\.pixels <= 0 && _scrolledUp == true', `
            '!scrolledUp && _scrolledUp == true'

          # 1b. setReadMarker: push rule 没匹配时回退到末条事件
          #     影响所有已读标记，不止这一个场景
          $c = $c -replace `
            '(// There is no event we could place a read marker\r?\n\s+if \(eventId == null\) return;)', `
            '// Fall back to latest visible event if no notifying event found`r`n    eventId ??= timeline.events.last.eventId;`r`n    if (eventId == null) return;'

          # 1c. _tryLoadTimeline: 时间线加载完后，直接标已读
          #     这是未读问题的核心修复，单点改动
          $c = $c -replace `
            '(await loadTimelineFuture;\r?\n)(\s+// We launched the chat with a given initial)', `
            "`${1}`r`n      // Immediately mark room as read when entering`r`n      if (timeline != null && timeline!.events.isNotEmpty) {`r`n        final lastEventId = timeline!.events.last.eventId;`r`n        if (lastEventId != null &&`r`n            lastEventId.isValidMatrixIdStrict() &&`r`n            room.fullyRead != lastEventId) {`r`n          timeline!.setReadMarker(`r`n            eventId: lastEventId,`r`n            public: AppSettings.sendPublicReadReceipts.value,`r`n          );`r`n          room.markUnread(false);`r`n        }`r`n      }`r`n`r`n`${2}"

          Set-Content $chat -Value $c -NoNewline
          Write-Host "Patched $chat"

          # === Patch 2: message.dart —— 右键复制 ===
          $msg = "lib/pages/chat/events/message.dart"
          $m = Get-Content $msg -Raw
          $m = $m -replace `
            '(onLongPress: longPressSelect[\s\S]*?onSelect\(event\);\s+},\r?\n)(\s+child: _AnimateIn\()', `
            "`${1}                                onSecondaryTapUp: (details) {`r`n                                  final body = event.getDisplayEvent(timeline).body;`r`n                                  if (body.isNotEmpty) {`r`n                                    Clipboard.setData(ClipboardData(text: body));`r`n                                  }`r`n                                },`r`n`${2}"
          Set-Content $msg -Value $m -NoNewline
          Write-Host "Patched $msg"

      # ============================================================
      # 编译
      # ============================================================

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      # ============================================================
      # 打包
      # ============================================================

      - name: Assemble and package
        shell: pwsh
        run: |
          $staging = "staging"
          New-Item -ItemType Directory -Force -Path $staging

          $exePath = Get-ChildItem -Path build -Recurse -Name "fluffychat.exe" | Select-Object -First 1
          if (-not $exePath) {
            Write-Host "ERROR: fluffychat.exe not found!"
            exit 1
          }
          $exeDir = "build\" + (Split-Path -Parent $exePath)
          Write-Host "Copying from $exeDir..."
          Copy-Item -Path "$exeDir\*" -Destination $staging -Recurse -Force

          Write-Host "Collecting all DLLs..."
          $dlls = Get-ChildItem -Path build -Recurse -Filter "*.dll" | Where-Object { $_.FullName -notlike "*\staging\*" }
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination $staging -Force
            Write-Host "  + $($dll.Name)"
          }

          $assetsSrc = Get-ChildItem -Path build -Recurse -Directory -Name "flutter_assets" | Select-Object -First 1
          if ($assetsSrc) {
            $assetsDest = "$staging\data\flutter_assets"
            if (-not (Test-Path $assetsDest)) {
              Write-Host "Copying flutter_assets..."
              Copy-Item -Path "build\$assetsSrc\*" -Destination $assetsDest -Recurse -Force
            }
          }

          $icudtl = Get-ChildItem -Path build -Recurse -Name "icudtl.dat" | Select-Object -First 1
          if ($icudtl) {
            Copy-Item -Path "build\$icudtl" -Destination "$staging\data\" -Force
            Write-Host "  + icudtl.dat"
          }

          Write-Host "=== Final staging directory: ==="
          Get-ChildItem $staging -Recurse

          Compress-Archive -Path "$staging\*" -DestinationPath fluffychat-windows-x64.zip
          Write-Host "Done: fluffychat-windows-x64.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat-windows-zip
          path: fluffychat-windows-x64.zip
          retention-days: 30
