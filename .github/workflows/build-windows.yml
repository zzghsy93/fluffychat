name: Build Windows

# FluffyChat Windows 构建工作流
# 用途：在 GitHub Actions 云端编译 FluffyChat Windows 桌面版 (.exe / .msix)
# 使用方法：
#   1. Fork https://github.com/krille-chan/fluffychat
#   2. 把这个文件放到 .github/workflows/ 目录下
#   3. Push 到 main 分支，CI 自动运行
#   4. 或者到 Actions 页面手动触发 (workflow_dispatch)

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    name: Build FluffyChat for Windows
    runs-on: windows-latest

    steps:
      # ---- 1. 检出代码 ----
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- 2. 安装 Rust (vodozemac 加密库依赖) ----
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ---- 3. 安装 Flutter SDK ----
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---- 4. 启用 Windows 桌面支持 ----
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # ---- 5. 修复 VS2026 C++ coroutine 编译错误 ----
      # local_auth_windows 插件用了废弃的 <experimental/coroutine>，
      # VS2026 (MSVC 14.51) 需要显式加这个宏才能编译通过
      - name: Patch coroutine deprecation error
        run: |
          $cmake = "windows/flutter/CMakeLists.txt"
          $define = "add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          if (Select-String -Path $cmake -Pattern "_SILENCE_EXPERIMENTAL" -Quiet) {
            Write-Host "Patch already applied."
          } else {
            Add-Content -Path $cmake -Value "`n$define"
            Write-Host "Patched $cmake"
          }

      # ---- 6. 确保 AppData 目录存在 (cargokit 需要) ----
      - name: Ensure AppData directory exists
        run: New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA"

      # ---- 7. 获取依赖 ----
      - name: Install dependencies
        run: flutter pub get

      # ---- 8. 编译 Windows 版本 ----
      - name: Build Windows (release)
        run: flutter build windows --release

      # ---- 9. 上传构建产物 ----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat-windows
          path: build/windows/runner/Release/
          retention-days: 30

      # ---- 10. 打包成 zip ----
      - name: Package as zip
        run: |
          Compress-Archive -Path build/windows/runner/Release/* -DestinationPath fluffychat-windows-x64.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat-windows-zip
          path: fluffychat-windows-x64.zip
          retention-days: 30
