name: Build Windows

# FluffyChat Windows 构建工作流
# 用途：在 GitHub Actions 云端编译 FluffyChat Windows 桌面版 (.exe / .msix)
# 使用方法：
#   1. Fork https://github.com/krille-chan/fluffychat
#   2. 把这个文件放到 .github/workflows/ 目录下
#   3. Push 到 main 分支，CI 自动运行
#   4. 或者到 Actions 页面手动触发 (workflow_dispatch)

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    name: Build FluffyChat for Windows
    runs-on: windows-latest

    steps:
      # ---- 1. 检出代码 ----
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- 2. 安装 Rust (vodozemac 加密库依赖) ----
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ---- 3. 安装 Flutter SDK ----
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---- 4. 启用 Windows 桌面支持 ----
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # ---- 5. 修复 VS2026 C++ coroutine 编译错误 ----
      # local_auth_windows 插件用了废弃的 <experimental/coroutine>，
      # VS2026 (MSVC 14.51) 需要显式加这个宏。CMakeLists 补丁管不到
      # 插件，必须用 CL 环境变量（MSVC 编译器会读取）全局注入。
      # _ALLOW_KEYWORD_MACROS 是因为 MSVC 新版本把 yield/await 当
      # 关键字了，coroutine 头文件需要这个宏才能用 #define await
      - name: Fix MSVC coroutine deprecation
        run: |
          echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_ALLOW_KEYWORD_MACROS" >> $env:GITHUB_ENV

      # ---- 6. 应用 bug 修复补丁 ----
      # (a) 未读标记：修复 _updateScrollController 用 maxScrollExtent
      #     判断是否在底部，替代错误的 pixels > 0 判断
      # (b) 复制消息：消息 GestureDetector 加上 onSecondaryTapUp，
      #     右键直接复制消息文本到剪贴板
      - name: Apply bugfix patches
        shell: pwsh
        run: |
          # Patch 1: chat.dart - fix scrolled-up detection
          $chatFile = "lib/pages/chat/chat.dart"
          $chatContent = Get-Content $chatFile -Raw

          # 1a. 在 _updateScrollController 里插入 scrolledUp 计算
          $chatContent = $chatContent -replace
            '(if \(!scrollController\.hasClients\) return;\r?\n)(\s+if \(timeline\?\.allowNewEvent == false \|\|)',
            "`${1}    final scrolledUp = scrollController.position.pixels <`r`n        scrollController.position.maxScrollExtent - 50.0;`r`n`${2}"

          # 1b. 替换条件判断
          $chatContent = $chatContent -replace
            'scrollController\.position\.pixels > 0 && _scrolledUp == false',
            'scrolledUp && _scrolledUp == false'
          $chatContent = $chatContent -replace
            'scrollController\.position\.pixels <= 0 && _scrolledUp == true',
            '!scrolledUp && _scrolledUp == true'

          Set-Content $chatFile -Value $chatContent -NoNewline
          Write-Host "Patched $chatFile"

          # Patch 2: message.dart - add right-click copy
          $msgFile = "lib/pages/chat/events/message.dart"
          $msgContent = Get-Content $msgFile -Raw
          $msgContent = $msgContent -replace
            '(onLongPress: longPressSelect[\s\S]*?onSelect\(event\);\s+},\r?\n)(\s+child: _AnimateIn\()',
            "`${1}                                onSecondaryTapUp: (details) {`r`n                                  final body = event.getDisplayEvent(timeline).body;`r`n                                  if (body.isNotEmpty) {`r`n                                    Clipboard.setData(ClipboardData(text: body));`r`n                                  }`r`n                                },`r`n`${2}"
          Set-Content $msgFile -Value $msgContent -NoNewline
          Write-Host "Patched $msgFile"

      # ---- 7. 获取依赖 ----
      - name: Install dependencies
        run: flutter pub get

      # ---- 8. 编译 Windows 版本 ----
      - name: Build Windows (release)
        run: flutter build windows --release

      # ---- 9. 组装完整产物并打包 ----
      # CMake 把 exe / dll / data 分散在不同子目录，直接打包 runner/Release
      # 会缺文件。这里用 staging 目录统一收集所有依赖再打包。
      - name: Assemble and package
        shell: pwsh
        run: |
          $staging = "staging"
          New-Item -ItemType Directory -Force -Path $staging

          # 1. 找到 fluffychat.exe 所在目录，复制所有文件（含 data/）
          $exePath = Get-ChildItem -Path build -Recurse -Name "fluffychat.exe" | Select-Object -First 1
          if (-not $exePath) {
            Write-Host "ERROR: fluffychat.exe not found!"
            exit 1
          }
          $exeDir = "build\" + (Split-Path -Parent $exePath)
          Write-Host "Copying from $exeDir..."
          Copy-Item -Path "$exeDir\*" -Destination $staging -Recurse -Force

          # 2. 收集 build 树里所有 .dll（插件 / engine / native_assets 等）
          Write-Host "Collecting all DLLs..."
          $dlls = Get-ChildItem -Path build -Recurse -Filter "*.dll" | Where-Object { $_.FullName -notlike "*\staging\*" }
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination $staging -Force
            Write-Host "  + $($dll.Name)"
          }

          # 3. 确保 data/flutter_assets 存在
          $assetsSrc = Get-ChildItem -Path build -Recurse -Directory -Name "flutter_assets" | Select-Object -First 1
          if ($assetsSrc) {
            $assetsDest = "$staging\data\flutter_assets"
            if (-not (Test-Path $assetsDest)) {
              Write-Host "Copying flutter_assets..."
              Copy-Item -Path "build\$assetsSrc\*" -Destination $assetsDest -Recurse -Force
              Copy-Item -Path "build\$assetsSrc" -Destination $assetsDest -Recurse -Force
            }
          }

          # 4. 确保 icudtl.dat
          $icudtl = Get-ChildItem -Path build -Recurse -Name "icudtl.dat" | Select-Object -First 1
          if ($icudtl) {
            Copy-Item -Path "build\$icudtl" -Destination "$staging\data\" -Force
            Write-Host "  + icudtl.dat"
          }

          Write-Host "=== Final staging directory: ==="
          Get-ChildItem $staging -Recurse

          Compress-Archive -Path "$staging\*" -DestinationPath fluffychat-windows-x64.zip
          Write-Host "Done: fluffychat-windows-x64.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat-windows-zip
          path: fluffychat-windows-x64.zip
          retention-days: 30
