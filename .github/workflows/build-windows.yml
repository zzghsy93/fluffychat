name: Build Windows

# FluffyChat Windows 构建工作流
# 用途：在 GitHub Actions 云端编译 FluffyChat Windows 桌面版 (.exe / .msix)
# 使用方法：
#   1. Fork https://github.com/krille-chan/fluffychat
#   2. 把这个文件放到 .github/workflows/ 目录下
#   3. Push 到 main 分支，CI 自动运行
#   4. 或者到 Actions 页面手动触发 (workflow_dispatch)

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    name: Build FluffyChat for Windows
    runs-on: windows-latest

    steps:
      # ---- 1. 检出代码 ----
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- 2. 安装 Rust (vodozemac 加密库依赖) ----
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ---- 3. 安装 Flutter SDK ----
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---- 4. 启用 Windows 桌面支持 ----
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # ---- 5. 修复 VS2026 C++ coroutine 编译错误 ----
      # local_auth_windows 插件用了废弃的 <experimental/coroutine>，
      # VS2026 (MSVC 14.51) 需要显式加这个宏。CMakeLists 补丁管不到
      # 插件，必须用 CL 环境变量（MSVC 编译器会读取）全局注入。
      # _ALLOW_KEYWORD_MACROS 是因为 MSVC 新版本把 yield/await 当
      # 关键字了，coroutine 头文件需要这个宏才能用 #define await
      - name: Fix MSVC coroutine deprecation
        run: |
          echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_ALLOW_KEYWORD_MACROS" >> $env:GITHUB_ENV

      # ---- 6. 获取依赖 ----
      - name: Install dependencies
        run: flutter pub get

      # ---- 7. 编译 Windows 版本 ----
      - name: Build Windows (release)
        run: flutter build windows --release

      # ---- 8. 查找产物并打包 ----
      - name: Find and package build output
        shell: pwsh
        run: |
          # CMake 可能把产物放在不同路径，先找 fluffychat.exe
          $exePath = Get-ChildItem -Path build -Recurse -Name "fluffychat.exe" | Select-Object -First 1
          if (-not $exePath) {
            Write-Host "ERROR: fluffychat.exe not found! Listing build dir:"
            Get-ChildItem build -Recurse -Depth 3
            exit 1
          }
          $releaseDir = Split-Path -Parent $exePath
          Write-Host "Found exe in: $releaseDir"
          Get-ChildItem $releaseDir
          Compress-Archive -Path "$releaseDir/*" -DestinationPath fluffychat-windows-x64.zip
          Write-Host "Zipped to fluffychat-windows-x64.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat-windows-zip
          path: fluffychat-windows-x64.zip
          retention-days: 30
