name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build FluffyChat for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Fix MSVC coroutine deprecation
        run: |
          echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_ALLOW_KEYWORD_MACROS" >> $env:GITHUB_ENV

      - name: Apply patches
        shell: pwsh
        run: |

          # === chat.dart ===
          $f = "lib/pages/chat/chat.dart"
          $c = Get-Content $f -Raw

          # 1. 打开房间时立刻标已读（只匹配 _tryLoadTimeline 里那一处）
          $c = $c -replace `
            'await loadTimelineFuture;\r?\n\s+// We launched the chat with a given initial', `
            "await loadTimelineFuture;`r`n    if (timeline != null && timeline!.events.isNotEmpty) { try { timeline!.setReadMarker(eventId: timeline!.events.last.eventId!, public: AppSettings.sendPublicReadReceipts.value); room.markUnread(false); } catch (_) {} }`r`n      // We launched the chat with a given initial"

          # 2. scrollToEventId: 跳到末条消息而不是读标记位置
          $c = $c -replace `
            'scrollToEventId\(readMarkerEventId, highlightEvent: false\);', `
            'scrollToEventId(timeline?.events.lastOrNull?.eventId ?? readMarkerEventId, highlightEvent: false);'

          # 3. setReadMarker: push rule 没匹配时回退到末条事件
          $c = $c -replace `
            '// There is no event we could place a read marker\r?\n\s+if \(eventId == null\) return;', `
            "// Fall back to latest visible event if no notifying event found`r`n    eventId ??= timeline.events.last.eventId;`r`n    if (eventId == null) return;"

          Set-Content $f -Value $c -NoNewline
          Write-Host "Patched $f"

          # === message.dart: right-click copy ===
          $m = "lib/pages/chat/events/message.dart"
          $mc = Get-Content $m -Raw
          $mc = $mc -replace `
            '(onLongPress: longPressSelect[\s\S]*?onSelect\(event\);\s+},\r?\n)(\s+child: _AnimateIn\()', `
            "`${1}                                onSecondaryTapUp: (details) {`r`n                                  final body = event.getDisplayEvent(timeline).body;`r`n                                  if (body.isNotEmpty) {`r`n                                    Clipboard.setData(ClipboardData(text: body));`r`n                                  }`r`n                                },`r`n`${2}"
          Set-Content $m -Value $mc -NoNewline
          Write-Host "Patched $m"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Assemble and package
        shell: pwsh
        run: |
          $staging = "staging"
          New-Item -ItemType Directory -Force -Path $staging

          $exePath = Get-ChildItem -Path build -Recurse -Name "fluffychat.exe" | Select-Object -First 1
          if (-not $exePath) {
            Write-Host "ERROR: fluffychat.exe not found!"
            exit 1
          }
          $exeDir = "build\" + (Split-Path -Parent $exePath)
          Write-Host "Copying from $exeDir..."
          Copy-Item -Path "$exeDir\*" -Destination $staging -Recurse -Force

          Write-Host "Collecting all DLLs..."
          $dlls = Get-ChildItem -Path build -Recurse -Filter "*.dll" | Where-Object { $_.FullName -notlike "*\staging\*" }
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination $staging -Force
            Write-Host "  + $($dll.Name)"
          }

          $assetsSrc = Get-ChildItem -Path build -Recurse -Directory -Name "flutter_assets" | Select-Object -First 1
          if ($assetsSrc) {
            $assetsDest = "$staging\data\flutter_assets"
            if (-not (Test-Path $assetsDest)) {
              Write-Host "Copying flutter_assets..."
              Copy-Item -Path "build\$assetsSrc\*" -Destination $assetsDest -Recurse -Force
            }
          }

          $icudtl = Get-ChildItem -Path build -Recurse -Name "icudtl.dat" | Select-Object -First 1
          if ($icudtl) {
            Copy-Item -Path "build\$icudtl" -Destination "$staging\data\" -Force
            Write-Host "  + icudtl.dat"
          }

          Write-Host "=== Final staging directory: ==="
          Get-ChildItem $staging -Recurse

          Compress-Archive -Path "$staging\*" -DestinationPath fluffychat-windows-x64.zip
          Write-Host "Done: fluffychat-windows-x64.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat-windows-zip
          path: fluffychat-windows-x64.zip
          retention-days: 30
